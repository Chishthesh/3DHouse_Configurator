server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build output never changes under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Models and textures are large and can be replaced, so revalidate rather than pin.
  location ~* \.(glb|jpg|jpeg|png|webp|avif|xlsx|csv|json)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # The app routes in the browser: any path that is not a file serves the shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
